<div id="mantra-block-overlay">
  <div class="mantra-block-card">
    <div class="mantra-block-header">
      <h1>Mantra Block</h1>
      <p class="mantra-block-subtitle">You chose to block this site.</p>
    </div>

    <div class="mantra-block-content">
      <p class="mantra-block-message">There is no timer. Are you sure you want to take a break?</p>

      <form id="mantra-form" class="mantra-block-form">
        <div class="form-group">
          <textarea
            id="mantra-input"
            class="mantra-input"
            placeholder="Enter your mantra here..."
            rows="3"
            spellcheck="true"
          ></textarea>
          <small class="form-hint">Type your mantra to continue.</small>
        </div>

        <button type="submit" class="submit-btn">Continue</button>
      </form>

      <a href="#" id="mantra-settings" class="settings-link">Edit Mantras & Blacklist</a>
    </div>
  </div>
</div>
